<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Sin conexión | PLANEAUML</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background: #ebebeb;
            color: #111111;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .offline-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        }
        .offline-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 1.35rem;
            margin: 0 0 0.5rem;
        }
        p {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.5;
            margin: 0 0 1.5rem;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <div class="offline-icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Sin conexión o señal muy lenta</h1>
        <p>No se pudo cargar esta vista en este momento. Puedes reintentar o volver a las páginas que ya abriste recientemente.</p>
        <div class="actions">
            <button type="button" class="btn btn-primary" onclick="window.location.reload()">Reintentar ahora</button>
            <a href="/" class="btn btn-secondary">Ir al inicio</a>
            <button type="button" class="btn btn-secondary" onclick="history.back()">Volver atrás</button>
        </div>
    </main>
</body>
</html>
